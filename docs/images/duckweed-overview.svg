<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Duckweed workspace overview</title>
  <desc id="desc">A dark desktop window with three panes for a shell, a coding agent, and tests, plus a Git status bar.</desc>
  <rect width="1400" height="820" rx="24" fill="#0b0f0d"/>
  <rect x="18" y="18" width="1364" height="784" rx="18" fill="#111714" stroke="#2b3a31" stroke-width="2"/>
  <rect x="18" y="18" width="1364" height="58" rx="18" fill="#171f1a"/>
