name: CI

# Frontend checks and native Rust compilation for work that is not yet a release.
# Pushes to `main` and `testing` skip this because the Release workflow validates
# the same source before its native build matrix.
on:
  push:
    branches-ignore:
      - main
      - testing
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun test

  rust:
    name: Rust check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri -> target
          key: ci-${{ matrix.os }}

      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml

  relay:
    name: Notification relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - run: npm ci --prefix relay

      - run: npm test --prefix relay

      - run: npm run --prefix relay build

  android:
    name: Android companion APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Configure Firebase
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            printf '%s' "$FIREBASE_CONFIG" | base64 --decode > android/app/google-services.json
          else
            cp android/app/google-services.example.json android/app/google-services.json
          fi

      - name: Build installable debug APK
        run: gradle -p android :app:testDebugUnitTest :app:assembleDebug -PduckweedVersionName="0.1.0-ci.${GITHUB_RUN_NUMBER}" -PduckweedVersionCode="$GITHUB_RUN_NUMBER" -PduckweedChannel="stable"

      - uses: actions/upload-artifact@v5
        with:
          name: duckweed-companion-ci-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
