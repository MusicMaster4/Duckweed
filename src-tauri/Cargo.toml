[package]
name = "duckweed"
version = "0.1.0"
description = "Duckweed — a Warp-like terminal built with Tauri + Rust"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
notify = "6.1"
# Usage buckets are keyed to local calendar days, which is the one date
# calculation not worth hand-rolling (DST, offsets, leap years).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Provider-reported quota snapshots use the same official OAuth endpoints as
# their CLIs. Blocking mode is safe here because usage scans already run on a
# dedicated blocking worker.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# OpenCode moved usage off per-message JSON files into a local SQLite DB.
# 0.40 pulls libsqlite3-sys that needs unstable cfg_select; 0.32 is solid.
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
    "Win32_UI_Shell",
] }
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
